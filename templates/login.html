{% extends "base.html" %}
{% block title %}Login - ExpenseAI{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h2>Welcome back</h2>
        <p class="text-muted">Login to continue to your dashboard.</p>
        <form method="POST">
            <label>Email</label>
            <input class="form-control mb-3" type="email" name="email" required>
            <label>Password</label>
            <input class="form-control mb-3" type="password" name="password" required>
            <button class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    </div>
</div>
{% endblock %}
